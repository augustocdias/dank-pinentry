name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Fail on warnings in CI without having to repeat -D warnings everywhere.
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        # Edition 2024 requires Rust 1.85 or newer.
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Unit and transcript tests
        run: cargo test --all-features

      - name: Release build
        run: cargo build --release

      - name: Upload binary for the integration job
        uses: actions/upload-artifact@v4
        with:
          name: dank-pinentry
          path: target/release/dank-pinentry
          retention-days: 1

  integration:
    name: Integration (pty + real gpg-agent)
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: dank-pinentry
          path: target/release

      - name: Restore the executable bit
        # Artifacts do not preserve permissions.
        run: chmod +x target/release/dank-pinentry

      - name: Install gnupg
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg

      - name: TTY frontend, driven through a pty
        # The terminal frontend opens the device named by OPTION ttyname
        # rather than reading stdin, so it cannot be tested by piping; a real
        # pty is required.
        run: python3 scripts/test-tty.py target/release/dank-pinentry

      - name: End-to-end with a real gpg-agent
        # Generates a key in a throwaway GNUPGHOME, signs, and verifies, with
        # gpg-agent driving dank-pinentry for the passphrase.
        run: python3 scripts/test-gpg-auto.py

  plugin:
    name: DMS plugin manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Manifest is valid JSON
        run: jq empty plugin/plugin.json

      - name: Every referenced component exists
        run: |
          set -euo pipefail
          missing=0
          # Component paths are relative to the plugin directory and written
          # with a leading "./".
          for rel in $(jq -r '
                (.components // {}) | to_entries[] | .value
              ' plugin/plugin.json) \
              $(jq -r '.settings // empty, .startupCheck // empty' plugin/plugin.json); do
            path="plugin/${rel#./}"
            if [[ ! -f $path ]]; then
              echo "missing component referenced by plugin.json: $path"
              missing=1
            fi
          done
          exit $missing

      - name: Translations
        run: python3 scripts/check-i18n.py plugin

      - name: Plugin id is camelCase
        # The registry enforces ^[a-zA-Z][a-zA-Z0-9]*$.
        run: |
          id=$(jq -r .id plugin/plugin.json)
          if [[ ! $id =~ ^[a-zA-Z][a-zA-Z0-9]*$ ]]; then
            echo "plugin id '$id' must be camelCase with no separators"
            exit 1
          fi

  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck scripts/*.sh

  nix:
    name: Nix (flake check, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - name: Flake check
        run: nix flake check --print-build-logs

      - name: Build the binary
        run: nix build .#dank-pinentry --print-build-logs

      - name: Build the plugin
        run: nix build .#dank-pinentry-plugin --print-build-logs
